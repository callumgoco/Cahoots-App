name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Cahoots
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run tests and unsigned Release archive
        run: Scripts/ci.sh
        env:
          CI_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.6
